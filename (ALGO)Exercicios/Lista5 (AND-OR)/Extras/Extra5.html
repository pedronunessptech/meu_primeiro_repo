<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Avaliação de aluno</h1>
    <label for="ipt_nota">Insira a nota do aluno: </label>
    <input type="text" id="ipt_nota"><br>
    <button onclick="avaliar()">Avaliar aluno</button>
</body>
</html>
<script>
    function avaliar(){
        let nota = Number(ipt_nota.value);
        if(nota>=6 && nota<8.5){
            alert("Aluno comum e aprovado");
        }else if(nota>=8.5 && nota<=10){
            alert("Aluno Exemplar!");
        }else{
            alert("Aluno não aprovado")
        }
    }
</script>
