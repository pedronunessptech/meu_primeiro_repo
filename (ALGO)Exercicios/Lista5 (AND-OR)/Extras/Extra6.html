<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Aprovação escolar</h1>
    <label for="ipt_nota">Insira a nota do aluno: </label>
    <input type="text" id="ipt_nota"><br>
    <label for="ipt_nota">Insira a frequencia do aluno: </label>
    <input type="text" id="ipt_freq"><br>
    <button onclick="avaliar()">Avaliar aluno</button>
</body>
</html>
<script>
    function avaliar(){
        let nota = Number(ipt_nota.value);
        let frequencia = Number(ipt_freq.value);

        if(nota>=6 && frequencia >=75){
            alert("Parabéns! Aprovado!");
        }else{
            alert("Infelizmente, não foi desta vez");
        }
    }
</script>
