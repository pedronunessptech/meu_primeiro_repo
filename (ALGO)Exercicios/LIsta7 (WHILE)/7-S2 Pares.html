<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="pares()">S2 Pares</button>
    <div id="exibir"></div>
</body>
</html>
<script> 
    let num = 0;
    function pares(){
        while(num < 100){
            num ++
            if(num%2 == 0){
                exibir.innerHTML += `${num}<br>`
            }
        }
        
}
    

</script>
