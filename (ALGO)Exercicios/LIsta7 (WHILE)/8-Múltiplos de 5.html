<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="ipt_num">Insira um número: </label>
    <input type="text" id="ipt_num">
    <button onclick="multiplos()">Adoro múltiplos de 5</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    let num = 0;
    function multiplos(){
        let limite = Number(ipt_num.value)
        if(limite>=20 && limite<=100){
        while(num < limite){
            num ++
            if(num%5 == 0){
                exibir.innerHTML += `${num}<br>`
            }
        }
        
    }
}
        
        

</script>
<!-- 8. Múltiplos de 5

Crie um programa o qual:

a) Receba do usuário um número (tem que ser entre 20 e 100)  

b) Ao clicar num botão "Adoro múltiplos de 5"...   

c) Exiba, debaixo do botão, todos os múltiplos de 5 entre 0 e o número informado em a), um embaixo do outro. Ex: 5, 10, 15, 20...    -->
