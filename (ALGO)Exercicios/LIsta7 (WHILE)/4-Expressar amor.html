<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="ipt_amor">Insira o nome da pessoa que você mais ama na vida: </label>
     <input type="text" id="ipt_amor"><br>
     <label for="ipt_num">Insira o quanto ama, em números: </label>
     <input type="text" id="ipt_num">
     <button onclick="amor()">Expressar Amor</button>
     <div id="exibir"></div>
</body>
</html>
<script>
    let qtdVzs = 0;
function amor(){
    let num = Number(ipt_num.value);
    let pessoa = ipt_amor.value
    while(qtdVzs < num){
        qtdVzs ++
        exibir.innerHTML += `${qtdVzs} - ${pessoa}, eu te amo! Sempre lembre disso!<br>`
    }
}
</script>
<!-- 4. Expressar amor

Crie um programa o qual:

a) Pergunte o nome da pessoa que o usuário mais ama na vida

b) Pergunte o quanto o usuário a ama (um número inteiro)

c) Ao clicar num botão "Expressar amor", devem aparecer, abaixo dele, N vezes (conforme o valor em b)) a frase indicada em a), como neste exemplo (considerando o nome "Lady Gaga" e que ama "3")   

      1 - Lady Gaga, eu te amo! Sempre lembre disso!   

      2 - Lady Gaga, eu te amo! Sempre lembre disso!   

      3 - Lady Gaga, eu te amo! Sempre lembre disso!    -->
