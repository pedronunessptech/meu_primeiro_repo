<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="ipt_voltas">Insira a quantidade de voltas que um carro dará na corrida</label>
    <input type="text" id="ipt_voltas">
    <button onclick="correr()">Iniciar Corrida</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    
    function correr(){
        let voltasDadas = 0;
        let voltas = Number(ipt_voltas.value)
        while(voltasDadas < voltas){
            voltasDadas ++
            exibir.innerHTML += ` Carro dando a ${voltasDadas}ª volta<br>`
        }
        exibir.innerHTML += `Corrida finalizada!<br>`
    }
</script>
<!-- 5. Corrida de Voltas

Crie um programa o qual:

a) Pergunte ao usuário quantas voltas um carro dará numa corrida   

b) Ao clicar num botão "Iniciar corrida!"...   

c) Até que o carro termine a corrida, exiba, debaixo do botão, frases como estas:   

       Carro dando a 1ª volta   

       Carro dando a 2ª volta   

       Carro dando a 3ª volta

       ...   (até a última volta informada pelo usuário)

d) Ao atingir o número de voltas informado, exiba, abaixo de tudo, a frase "Corrida finalizada!".

OBS: ao 'finalizar' as repetições das voltas, após o while, deve aparecer a mensagem.  -->
