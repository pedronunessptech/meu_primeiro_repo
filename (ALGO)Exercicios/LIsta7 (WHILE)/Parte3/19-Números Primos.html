<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Divisores!</h1>
    <label for="ipt_num">Insira um valor entre 0 e 100: </label>
    <input type="text" id="ipt_num">
    <button onclick="ver()">Ver divisores</button>
    <div id="exibir"></div>
    
</body>
</html>
<script>
    let cont = 0; 
    function ver(){
        let n2 = 0;
        let num = Number(ipt_num.value)
        if(num < 0 || num > 100){
            exibir.innerHTML = `<span style="color: red;">O número (${num}) não é valido, insira um valor correto!</span>`
        }else{
            exibir.innerHTML += `Divisores do Número ${num}<br><br>`
            while(cont < num){
                 cont ++
            if(num%cont == 0){
                exibir.innerHTML += `${cont}<br><br>`
            }
            
        }
        if(num%2 != 0){
            exibir.innerHTML += `O número ${num} é um número primo.`
        }
    }
}
    
</script>
