<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="filtrar()">Filtrar números Cabalísticos</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    let num = 0;
    function filtrar(){
        while(num < 30){
            num ++
            if(num != 3 && num !=4 && num !=7 && num !=10 && num !=12){
            exibir.innerHTML += `${num}<br>`
            }
        }
        
    }
    
</script>
