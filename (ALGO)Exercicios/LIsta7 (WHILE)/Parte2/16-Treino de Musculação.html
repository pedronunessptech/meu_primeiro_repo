<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="ipt_musc">Insira o intervalo de dias você treina: </label>
    <input type="text" id="ipt_musc">
    <button onclick="rotina()"> Exibir rotina mensal </button><br>
    <div id="exibir"></div>
</body>
</html>
<script>
    function rotina(){
        let dias = Number(ipt_musc.value)
        let dia = 1;
        while(dia <= 30){
            if(dia%dias == 1){
                exibir.innerHTML += `Dia${dia} - Musculação<br><br>`
                dia ++
            }else{
                exibir.innerHTML += `Dia${dia} - Comer, dormir etc<br><br>`
                dia ++
            }
        }

    }
</script>
