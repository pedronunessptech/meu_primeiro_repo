<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="slc_numTabu">Selecione o número da tabuada: </label>
    <select name="numTabu" id="slc_Tabu">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
    </select><br>
    <label for="ipt_num">Insira o número limite</label>
    <input type="text" id="ipt_num">
    <button onclick="tabuada()">Ver tabuada</button><br>
    <div id="exibir"></div>
    
</body>
</html>
<script>
let n1 = 1;
let total = 0;
function tabuada(){
    let limite = Number(ipt_num.value);
    let n2 = Number(slc_Tabu.value);
    while(n1 <= limite){
        total = n2 * n1
        n1 ++
        if(total % 2 == 0){
            exibir.innerHTML += `<b style="color: blue;">${n2} x ${n1} = ${total}</b><br><br>`
        }else{
            exibir.innerHTML += `<b style="color: red;">${n2} x ${n1} = ${total}</b><br><br>`
        }
        
    }
}
</script>
