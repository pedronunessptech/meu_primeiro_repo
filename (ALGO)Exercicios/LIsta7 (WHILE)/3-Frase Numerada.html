<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="palavra()">Algoritimos</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    function palavra(){
        let qtd = 0;
        let palavra = '';
        while(qtd < 7){
            qtd ++
            palavra = 'Eu adoro programar!'
            exibir.innerHTML += `${qtd} - ${palavra} <br>`
            
        }
    }

</script>
