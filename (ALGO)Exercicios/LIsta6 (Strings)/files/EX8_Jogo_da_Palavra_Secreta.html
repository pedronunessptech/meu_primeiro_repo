<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Palavra Secreta</title>
</head>
<body>
    <h2>Jogo da Palavra Secreta!</h2>
    <label for="iptLetra">Insira uma letra: </label>
    <input type="text" id="iptLetra">
    <button onclick="verificar()">Verificar Letras</button>
    <div id="exibir"></div>
<script>
    let palavraSecreta = 'morango';

    function verificar(){
        let letra = iptLetra.value.toLowerCase();
        if(letra.length == 0){
            exibir.innerHTML = `Digite alguma letra!`;
        } else if(palavraSecreta.includes(letra)){
            exibir.innerHTML = `A letra ${letra} aparece na palavra secreta!`;
        } else {
            exibir.innerHTML = `A letra ${letra} não aparece na palavra secreta!`;
        }
    }
</script>
</body>
</html>
