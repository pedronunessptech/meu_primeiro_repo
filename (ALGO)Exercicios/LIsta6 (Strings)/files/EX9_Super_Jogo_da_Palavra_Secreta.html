<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Jogo da Palavra Secreta</title>
</head>
<body>
    <h2>Super Jogo da Palavra Secreta!</h2>
    <label for="iptLetra">Insira uma letra: </label>
    <input type="text" id="iptLetra" maxlength="1">
    <button onclick="verificar()">Verificar Letra</button>
    <div id="exibir"></div>
<script>
    let palavraSecreta = 'Aurélio';
    // guarda só o que ainda não foi descoberto (letras repetidas contam cada uma)
    let pendentes = palavraSecreta.toLowerCase();

    exibir.innerHTML = `Palavra secreta definida! Descubra todos os ${palavraSecreta.length} caracteres!`;

    function verificar(){
        if(pendentes.length == 0){
            return; // jogo já terminou, não faz mais nada
        }
        let letra = iptLetra.value.toLowerCase();
        if(letra.length == 0){
            exibir.innerHTML = `Digite uma letra!`;
        } else {
            if(pendentes.includes(letra)){
                pendentes = pendentes.replace(letra, ''); // remove só a 1ª ocorrência
                exibir.innerHTML = `O caractere ${letra} aparece na palavra secreta! Faltam ${pendentes.length} caracteres`;
            } else {
                exibir.innerHTML = `O caractere ${letra} NÃO aparece na palavra secreta! Faltam ${pendentes.length} caracteres`;
            }
            if(pendentes.length == 0){
                exibir.innerHTML = `Parabéns, você descobriu todas as letras da palavra secreta ${palavraSecreta}!`;
            }
        }
        iptLetra.value = '';
        iptLetra.focus();
    }
</script>
</body>
</html>
