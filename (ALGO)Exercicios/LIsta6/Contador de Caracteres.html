<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Contador de Caracteres</H1>
    <input type="text" id="ipt_frase">
    <button onclick="exibir()">Analisar frase</button>
    <div id="div_exibir"></div>
   
</body>
</html>
<script>
    function exibir(){
        let frase = ipt_frase.value;
        let fraseCarac = frase.length;
        div_exibir.innerHTML = `Tamanho da frase: ${fraseCarac}<br>`
        if(fraseCarac<10){
        div_exibir.innerHTML +=` <b style="color: red;">Frase Curta!</b>`;  
        }else{
        div_exibir.innerHTML +=` <b style="color: blue;">Frase Longa!</b>`;
        }
    }
</script>
