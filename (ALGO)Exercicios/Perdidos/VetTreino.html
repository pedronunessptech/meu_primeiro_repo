<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="ipt" oninput="vet()">
    <div id="exibir"></div>
</body>
</html>
<script>
    let frutas = ['maça','pera','uva']
    function vet(){
        let num = Number(ipt.value)
        exibir.innerHTML = `${frutas[num]}`
    }
</script>
