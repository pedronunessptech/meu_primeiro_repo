<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
O percentual de aumento semanal desejado(de 0 a 100).
<input type="text" id="ipt_percentual"><br>
Distância inicial semanal do aluno (em km).
<input type="text" id="ipt_inicialKM"><br>
A meta de distância semanal (em km).
<input type="text" id="ipt_metaKM"><br>
O número máximo de semanas do plano.
<input type="text" id="ipt_maxSemana"><br>

<button onclick="gerar()">Gerar Planilha</button>
<div id="exibir"></div>    
</body>
</html>
<script>
    let semanaAtu = 0;
    let kmPercorrido = 0;
function gerar(){
let percentual = Number(ipt_percentual.value);
let inicialKM = Number(ipt_inicialKM.value);
let metaKM = Number(ipt_metaKM.value);
let maxSemana = Number(ipt_maxSemana.value);
 if(inicialKM <= 0){
    alert('A distancia inical deve ser maior que 0')
 }else if(percentual<1 || percentual>10){
    alert('O percentual estar entre 1 e 10')
 }else if(metaKM<=inicialKM){
    alert('A meta tem que ser maior que a distancia inicial')
 }else if(maxSemana < 1 || maxSemana > 24){
    alert('O número de semanas deve estar entre 1 e 24')
 }else{
    while(semanaAtu < maxSemana && inicialKM < metaKM){
        semanaAtu++
        kmPercorrido +=inicialKM
        if(semanaAtu % 4 == 0){
            exibir.innerHTML += `SEMANA ${semanaAtu} - ${(inicialKM*0.70).toFixed(2)} km (${(inicialKM / metaKM * 100).toFixed(2)}% da meta)<br>`
        }else{
            exibir.innerHTML += `SEMANA ${semanaAtu} - ${inicialKM.toFixed(2)} km (${(inicialKM / metaKM * 100).toFixed(2)}% da meta)<br>`
            inicialKM += inicialKM*(percentual/100).toFixed(2)
            }
    }
    if(inicialKM >= metaKM){
        exibir.innerHTML+=`Meta de ${metaKM} km atingida na semana ${semanaAtu}! Total acumulado no plano: ${kmPercorrido.toFixed(2)} km."`
    }else{
        exibir.innerHTML+=`Meta não atingida em ${semanaAtu} semanas. A última semana chegou a ${(inicialKM / metaKM * 100).toFixed(2)}% da meta. Total acumulado no plano: ${kmPercorrido.toFixed(2)} km."`
    }

 }

}
</script>
