<script>

        if(qtdMaca > 0 && prcMaca > 0 && qtdBrig > 0 &&prcBrig > 0 &&qtdCup > 0 &&prcCup > 0 &&qtdCheese > 0 &&prcCheese > 0){
            while(contVenda < vendas){
                contVenda ++
                while(contVenda < qtdMaca){
                    if(qtdMaca =0){

                    exibir.innerHTML += `Venda ${contVenda} - IMG macaron - 1<br>`
                }
                }

            let total = prcMaca*qtdMaca + prcBrig*qtdBrig + prcCup*qtdCup + prcCheese*qtdCheese
