<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Corrida entre Coelho e a Tartaruga</h1>
    <label for="iptPista">Insira o tamanho da pista: </label>
    <input type="text" id="iptPista"><br>
    <label for="iptTartaruga">Insira quantos metros o Tartarugo Devagarinho andará por rodada: </label>
    <input type="text" id="iptTartaruga"><br>
    <label for="iptCoelho">Insira quantos metros o Coelhildo Soneca andará por rodada: </label>
    <input type="text" id="iptCoelho"><br>
     <label for="iptCoelhoSono">Insira a cada quantas rodadas Coelhildo Soneca domirá: </label>
    <input type="text" id="iptCoelhoSono"><br>
    <button onclick="largada()"> Dar a Largada! </button><br>
    <div id="exibir"></div>
</body>
</html>
<script>
    let rodada = 0;
    let corridaTartaruga = 0;
    let corridaCoelho = 0;
    let contadorSono = 0;
    function largada(){
        let pista = Number(iptPista.value)
        let coelho = Number(iptCoelho.value)
        let sono = Number(iptCoelhoSono.value)
        let tartaruga =Number(iptTartaruga.value)
        if(coelho==0 || sono==0 || tartaruga==0 || pista ==0 || tartaruga >= coelho || sono < 2){
            exibir.innerHTML += '<b style="color: red;">Certifique-se de inserir todos os valores corretamente! </b><br>'
        }else{
            exibir.innerHTML += `(pista: ${pista}m | tartaruga: ${tartaruga}m | coelho: ${coelho}m | soneca a cada ${sono} rodadas)<br><br>`
            while(corridaTartaruga < pista && corridaCoelho < pista){
                rodada ++
                corridaTartaruga += tartaruga
                if(rodada != 1 && rodada % sono  == 0){
                    exibir.innerHTML += `Rodada ${rodada}: Tartaruga ${corridaTartaruga}m | Coelho ${corridaCoelho}m - Coelhildo dormindo<br>`
                    contadorSono ++
                }else{
                    corridaCoelho += coelho
                    exibir.innerHTML += `Rodada ${rodada}: Tartaruga ${corridaTartaruga}m | Coelho ${corridaCoelho}m<br>`
                }
            }
            let percentualCoelho = corridaCoelho * 100 / pista 
            let percentualTartaruga = corridaTartaruga * 100 / pista 
            
            if(corridaCoelho == corridaTartaruga){
                exibir.innerHTML += `<br><br>Empate no fim da rodada ${rodada}<br>`
            }else if(corridaTartaruga >= pista){
                exibir.innerHTML +=`<br><br>Tartarugo Devagarinho venceu na rodada ${rodada}!<br> O coelho percorreu ${percentualCoelho}%<br> E o coelho dormiu ${contadorSono} vezes`
            }else{
                exibir.innerHTML += `<br><br>Coelhildo Soneca venceu na rodada ${rodada}!<br> A tartaruga percorreu ${percentualTartaruga}%<br> E o coelho dormiu ${contadorSono} vezes`
            }
    
        }
    }
        </script>
