<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Avaliação de nota</h1>
    <label for="ipt_nota">Insira a nota do aluno: </label>
    <input type="text" id="ipt_nota"><br>
    <button onclick="avaliar()">Avaliar aluno</button>
</body>
</html>
<script>
    function avaliar(){
        let nota = Number(ipt_nota.value);
        if(nota>0 && nota <=10){
            alert("Nota válida!");
        }else{
            alert("onde já se viu nota menor que 0 e maior que 10?!");
        }
    }
</script>
