<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Avalie nosso atendimento!</h2>
    <label for="ipt_nota"> Insira uma nota de 0 a 10: </label>
    <input type="text" id="ipt_nota">
    <span>(0 Muito ruim e 10 Excelente)</span><br><br>
    <button onclick="avaliar()">Avaliar atendimento</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function avaliar(){
        let nota = Number(ipt_nota.value)
        if(nota<0 | nota>10){
            div_exibir.innerHTML = "Nota inválida"
        }else if(nota >= 0 && nota <5 ){
            div_exibir.innerHTML = "Não aprovado"
        }else if(nota>=5 && nota<=6){
            div_exibir.innerHTML = "Neutro"
        }else{
            div_exibir.innerHTML = "Aprovado"
        };
    
    }
</script>
